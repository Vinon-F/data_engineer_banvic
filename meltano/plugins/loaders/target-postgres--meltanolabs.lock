{
  "plugin_type": "loaders",
  "name": "target-postgres",
  "namespace": "target_postgres",
  "variant": "meltanolabs",
  "label": "Postgres",
  "docs": "https://hub.meltano.com/loaders/target-postgres--meltanolabs",
  "repo": "https://github.com/MeltanoLabs/target-postgres",
  "pip_url": "meltanolabs-target-postgres",
  "description": "PostgreSQL database loader",
  "logo_url": "https://hub.meltano.com/assets/logos/loaders/postgres.png",
  "capabilities": [
    "about",
    "activate-version",
    "hard-delete",
    "schema-flattening",
    "stream-maps",
    "structured-logging",
    "validate-records"
  ],
  "settings_group_validation": [],
  "settings": [
    {
      "name": "activate_version",
      "kind": "boolean",
      "value": true,
      "label": "Activate Version",
      "description": "If set to false, the tap will ignore activate version messages. If set to true, add_record_metadata must be set to true as well."
    },
    {
      "name": "add_record_metadata",
      "kind": "boolean",
      "value": true,
      "label": "Add Record Metadata",
      "description": "Note that this must be enabled for activate_version to work!This adds _sdc_extracted_at, _sdc_batched_at, and more to every table. See https://sdk.meltano.com/en/latest/implementation/record_metadata.html for more information."
    },
    {
      "name": "batch_size_rows",
      "kind": "integer",
      "label": "Batch Size Rows",
      "description": "Maximum number of rows in each batch."
    },
    {
      "name": "database",
      "kind": "string",
      "label": "Database",
      "description": "Database name. Note if sqlalchemy_url is set this will be ignored."
    },
    {
      "name": "default_target_schema",
      "kind": "string",
      "value": "$MELTANO_EXTRACT__LOAD_SCHEMA",
      "label": "Default Target Schema",
      "description": "Postgres schema to send data to, example: tap-clickup"
    },
    {
      "name": "flattening_enabled",
      "kind": "boolean",
      "label": "Enable Schema Flattening",
      "description": "'True' to enable schema flattening and automatically expand nested properties."
    },
    {
      "name": "flattening_max_depth",
      "kind": "integer",
      "label": "Max Flattening Depth",
      "description": "The max depth to flatten schemas."
    },
    {
      "name": "hard_delete",
      "kind": "boolean",
      "value": false,
      "label": "Hard Delete",
      "description": "When activate version is sent from a tap this specifies if we should delete the records that don't match, or mark them with a date in the `_sdc_deleted_at` column. This config option is ignored if `activate_version` is set to false."
    },
    {
      "name": "host",
      "kind": "string",
      "label": "Host",
      "description": "Hostname for postgres instance. Note if sqlalchemy_url is set this will be ignored."
    },
    {
      "name": "load_method",
      "kind": "options",
      "value": "append-only",
      "label": "Load Method",
      "description": "The method to use when loading data into the destination. `append-only` will always write all input records whether that records already exists or not. `upsert` will update existing records and insert new records. `overwrite` will delete all existing records and insert all input records.",
      "options": [
        { "label": "Append Only", "value": "append-only" },
        { "label": "Upsert", "value": "upsert" },
        { "label": "Overwrite", "value": "overwrite" }
      ]
    },
    {
      "name": "password",
      "kind": "password",
      "label": "Password",
      "sensitive": true,
      "description": "Password used to authenticate. Note if sqlalchemy_url is set this will be ignored."
    },
    {
      "name": "port",
      "kind": "integer",
      "value": 5432,
      "label": "Port",
      "description": "The port on which postgres is awaiting connection. Note if sqlalchemy_url is set this will be ignored."
    },
    {
      "name": "sqlalchemy_url",
      "kind": "string",
      "label": "SQLAlchemy URL",
      "description": "SQLAlchemy connection string. This will override using host, user, password, port, dialect, and all ssl settings."
    },
    {
      "name": "ssl_enable",
      "kind": "boolean",
      "value": false,
      "label": "SSL Enable",
      "description": "Whether or not to use ssl to verify the server's identity. Note if sqlalchemy_url is set this will be ignored."
    },
    {
      "name": "ssl_mode",
      "kind": "string",
      "value": "verify-full",
      "label": "SSL Mode",
      "description": "SSL Protection method. Must be one of disable, allow, prefer, require, verify-ca, or verify-full."
    },
    {
      "name": "stream_maps",
      "kind": "object",
      "label": "Stream Maps",
      "description": "Config object for stream maps capability."
    },
    {
      "name": "stream_map_config",
      "kind": "object",
      "label": "User Stream Map Configuration",
      "description": "User-defined config values to be used within map expressions."
    },
    {
      "name": "use_copy",
      "kind": "boolean",
      "value": false,
      "label": "Use COPY",
      "description": "Use the COPY command to insert data. This is usually faster than INSERT statements."
    },
    {
      "name": "user",
      "kind": "string",
      "label": "User",
      "description": "User name used to authenticate. Note if sqlalchemy_url is set this will be ignored."
    },
    {
      "name": "validate_records",
      "kind": "boolean",
      "value": true,
      "label": "Validate Records",
      "description": "Whether to validate the schema of the incoming streams."
    }
  ]
}
